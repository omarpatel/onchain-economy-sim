name: CI

# Off-chain packages only. The web client and settlement worker import IDL/types
# generated by `anchor build` (packages/chain/target), which needs the
# Rust/Solana/Anchor toolchain; those checks run locally via WSL.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (sim, server)
        run: npx tsc --noEmit -p packages/sim && npx tsc --noEmit -p packages/server
      - name: Test economy engine
        run: node packages/sim/test.ts
      - name: Test tick server and SIWS auth
        run: node --test packages/server/test.ts packages/web/test/siws.test.ts
